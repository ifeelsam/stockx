[package]
name = "scratchers-magicsvm-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: needs a newer Rust than the program toolchain (run with `cargo +stable test`).
[workspace]

[dev-dependencies]
anchor-lang = "=1.2.2"
anchor-spl = "=1.2.2"
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["anchor", "vrf"] }
magicsvm = "0.3.0"
scratchers = { path = "../../programs/scratchers", features = ["no-entrypoint"] }
bytemuck = "1"
serde_json = "1"
solana-account = "4"
solana-address = "~2.6.1"
solana-clock = "3"
solana-hash = "~4.5.0"
solana-instruction = { version = "~3.4.0", features = ["bincode"] }
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-native-token = "3.0.0"
solana-signer = "3.0.1"
solana-transaction = { version = "4.1.5", features = ["verify"] }
